<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>FPCA Records Dashboard</title>
<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background:#f1f5f9;
    padding:20px;

    animation:
    fadeIn 0.8s ease;
}
#loginPage{

    max-width:450px;

    margin:80px auto;

    padding:40px;

    background:rgba(255,255,255,.9);

    backdrop-filter:blur(15px);

    border-radius:20px;

    box-shadow:
    0 15px 40px
    rgba(0,0,0,.15);

    text-align:center;

}

#loginPage input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border-radius:12px;

    border:1px solid #d1d5db;

    font-family:'Poppins',sans-serif;

    transition:.3s;

}

#loginPage input:focus{

    outline:none;

    border-color:#003b8e;

    box-shadow:
    0 0 15px
    rgba(0,59,142,.25);

}

#loginPage button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
    135deg,
    #003b8e,
    #0056d6
    );

    color:white;

    font-weight:700;

    cursor:pointer;

    transition:.3s;

}

#loginPage button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 25px
    rgba(0,59,142,.35);

}
#totalCard{

    transition:.3s;

    cursor:pointer;

}

#totalCard:hover{

    transform:translateY(-8px);

    box-shadow:
    0 15px 35px
    rgba(0,59,142,.30);

}
table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#003b8e;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
    color:#1e293b;
    font-weight:500;
}
tr:hover{
    background:#f8fafc;
}
@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}
.approvedCard{

    transition:.3s;

}

.approvedCard:hover{

    transform:translateY(-8px);

    box-shadow:
    0 15px 35px
    rgba(22,163,74,.35);

}
.header-banner{

    background:
    linear-gradient(
    135deg,
    #003b8e,
    #001f5b
    );

    color:white;

    padding:25px;

    border-radius:20px;

    margin-bottom:25px;

    box-shadow:
    0 10px 30px
    rgba(0,0,0,.15);

}
.header-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.logoutBtn{

    background:#dc2626;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:12px;

    font-family:'Poppins',sans-serif;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.logoutBtn:hover{

    transform:translateY(-2px);

    opacity:.9;

}
.search-container{

    background:white;

    padding:18px;

    border-radius:16px;

    box-shadow:
    0 6px 20px rgba(0,0,0,.08);

    display:flex;

    gap:12px;

    align-items:center;

    flex-wrap:wrap;

    margin-bottom:20px;

}
*{
    font-family:'Poppins',sans-serif;
}
h1,
h2,
h3,
p,
td,
th{

    color:inherit;

}
table td{

    color:#1e293b !important;

}

</style>

</head>

<body>

    <div id="loginPage">

<h1>
IONICS FPCA MES
</h1>

<p style="color:#475569;">
Checksheet Monitoring 

<input
type="text"
id="username"
placeholder="Username">

<br><br>

<input
type="password"
id="password"
placeholder="Password">

<br><br>

<button onclick="login()">

LOGIN

</button>

</div>

<div id="dashboardPage" style="display:none;">

<div class="header-banner">

<div class="header-top">

<div>

<h1 style="color:white;">
IONICS FPCA MES
</h1>

<p style="color:white;">
Checksheet Monitoring Dashboard
</p>

</div>


<button
onclick="logout()"
class="logoutBtn">

🚪 LOGOUT

</button>

</div>

<div style="
display:flex;
justify-content:center;
gap:20px;
margin-bottom:30px;
flex-wrap:wrap;
">

<div id="totalCard" style="
background:#003b8e;
color:white;
padding:20px;
border-radius:12px;
min-width:180px;
">

<h3>Total Records</h3>

<h1 id="totalRecords">
0
</h1>

</div>

<div class="approvedCard" style="
background:#16a34a;
color:white;
padding:20px;
border-radius:12px;
min-width:180px;
">

<h3>Approved</h3>

<h1 id="approvedCount">
0
</h1>

</div>

<div style="
background:#f59e0b;
color:white;
padding:20px;
border-radius:12px;
min-width:180px;
">

<h3>Pending</h3>

<h1 id="pendingCount">
0
</h1>

</div>

<div style="
background:#dc2626;
color:white;
padding:20px;
border-radius:12px;
min-width:180px;
">

<h3>Rejected</h3>

<h1 id="rejectedCount">
0
</h1>

</div>

</div>

<div class="search-container">

<select
id="filterColumn"
style="
padding:12px;
border-radius:10px;
border:1px solid #d1d5db;
font-family:Poppins;
">

<option value="0">Operator</option>
<option value="1">Employee ID</option>
<option value="2">Workstation</option>
<option value="3">Process</option>
<option value="4">Shift</option>
<option value="5">Status</option>
<option value="6">Approved By</option>
<option value="7">Submitted Time</option>

</select>

<input
type="text"
id="searchInput"
placeholder="🔍 Search Records..."
onkeyup="filterTable()"
style="
padding:12px 15px;
width:320px;
border-radius:12px;
border:1px solid #d1d5db;
font-family:'Poppins',sans-serif;
font-size:14px;
outline:none;
">

<button
id="exportRecordsBtn"
style="
background:#16a34a;
color:white;
border:none;
padding:12px 22px;
border-radius:12px;
font-weight:600;
cursor:pointer;
">

📊 EXPORT AUDIT CSV

</button>
<button
id="exportDeletedBtn"
style="
background:#f59e0b;
color:white;
border:none;
padding:12px 22px;
border-radius:12px;
font-weight:600;
cursor:pointer;
">

📂 EXPORT DELETED RECORDS

</button>

<button
id="exportAuditBtn"
style="
background:#6366f1;
color:white;
border:none;
padding:12px 22px;
border-radius:12px;
font-weight:600;
cursor:pointer;
">

📋 EXPORT AUDIT LOGS

</button>

</div>

<table>

<thead>

<tr>

<th>Operator</th>
<th>Employee ID</th>
<th>Workstation</th>
<th>Process</th>
<th>Shift</th>
<th>Status</th>
<th>Approved By</th>
<th>Submitted Time</th>
<th>Action</th>

</tr>

</thead>

<tbody id="recordsTable">

</tbody>

</div>

</table>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
doc,
updateDoc,
query
}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyAlRH4Oz-RSoYzANfOZ1icNeXjOCEkqH-c",

authDomain: "fpca---startup---checksheet.firebaseapp.com",

projectId: "fpca---startup---checksheet",

storageBucket: "fpca---startup---checksheet.firebasestorage.app",

messagingSenderId: "151525817490",

appId: "1:151525817490:web:c52655d526f0fdcd37ba4b"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
let allRecords = [];

async function loadRecords(){

    allRecords = [];

    const snapshot =
    await getDocs(
        collection(
            db,
            "startup_verification"
        )
    );

    let html = "";

let approved = 0;
let pending = 0;
let rejected = 0;

let visibleRecords = 0;
    snapshot.forEach(doc => {
const data = doc.data();
if(data.deleted === true){
    return;
}

visibleRecords++;

data.docId = doc.id;
        if(data.approvalStatus === "Approved"){
    approved++;
}

if(data.approvalStatus === "Pending"){
    pending++;
}

if(data.approvalStatus === "Rejected"){
    rejected++;
}

allRecords.push(data);

        html += `

        <tr>

            <td>${data.operator || ""}</td>

            <td>${data.employeeId || ""}</td>

            <td>${data.workstation || ""}</td>

            <td>${data.process || ""}</td>

            <td>${data.shift || ""}</td>

            <td>${data.approvalStatus || ""}</td>
            <td>${data.supervisor || ""}</td>

<td>
${data.timestamp
 ? new Date(data.timestamp).toLocaleString()
 : ""}
</td>

<td>

<button
onclick="deleteRecord('${doc.id}')"
style="
background:#dc2626;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
">

🗑 Delete

</button>

</td>


        </tr>

        `;

    });
    document.getElementById(
"totalRecords"
).innerText =
visibleRecords;
document.getElementById(
"approvedCount"
).innerText =
approved;

document.getElementById(
"pendingCount"
).innerText =
pending;

document.getElementById(
"rejectedCount"
).innerText =
rejected;

    document.getElementById(
        "recordsTable"
    ).innerHTML = html;

}

loadRecords();
document
.getElementById("exportRecordsBtn")
.addEventListener(
    "click",
    exportRecords
);
document
.getElementById("exportDeletedBtn")
.addEventListener(
    "click",
    exportDeletedRecords
);
document
.getElementById("exportAuditBtn")
.addEventListener(
    "click",
    exportAuditLogs
);
async function exportRecords(){

await addDoc(
    collection(db,"audit_logs"),
    {
        action:"EXPORT_CSV",
        username:"toshiba",
        timestamp:new Date().toISOString()
    }
);

    let csv = [];

    csv.push(
        "Operator,Employee ID,Workstation,Process,Shift,Status,Approved By,Submitted Time"
    );

    document
    .querySelectorAll("#recordsTable tr")
    .forEach(row => {

        const cols = row.querySelectorAll("td");

        if(cols.length){

            let rowData = [];

for(let i = 0; i < cols.length - 1; i++){

    rowData.push(
        '"' + cols[i].innerText + '"'
    );

}
            csv.push(rowData.join(","));

        }

    });

    const blob = new Blob(
        [csv.join("\n")],
        {
            type:"text/csv;charset=utf-8;"
        }
    );

    const url =
    URL.createObjectURL(blob);

    const link =
    document.createElement("a");

    link.href = url;

    link.download =
    "FPCA-Submission-Records.csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}

window.filterTable = function(){

    const searchText =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase();

    const column = parseInt(
    document.getElementById("filterColumn").value
    );

    const rows =
    document.querySelectorAll("#recordsTable tr");

    rows.forEach(row=>{

        const cells =
        row.querySelectorAll("td");

        if(!cells.length) return;

        const value =
        cells[column]
        .textContent
        .toLowerCase();

        row.style.display =
        value.includes(searchText)
        ? ""
        : "none";

    });

}
window.login = function(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    if(
        username === "toshiba"
        &&
        password === "tosh123"
    ){
        addDoc(
    collection(db,"audit_logs"),
    {
        action:"LOGIN",
        username:username,
        timestamp:new Date().toISOString()
    }
);

        document
        .getElementById("loginPage")
        .style.display = "none";

        document
        .getElementById("dashboardPage")
        .style.display = "block";

    }
    else{

        alert(
            "Invalid Username or Password"
        );

    }

}
window.logout = async function(){

await addDoc(
    collection(db,"audit_logs"),
    {
        action:"LOGOUT",
        username:"toshiba",
        timestamp:new Date().toISOString()
    }
);

    document
    .getElementById("dashboardPage")
    .style.display = "none";

    document
    .getElementById("loginPage")
    .style.display = "block";

    document
    .getElementById("username")
    .value = "";

    document
    .getElementById("password")
    .value = "";

}
window.deleteRecord = async function(recordId){

    const supervisorId =
    prompt(
        "Enter Supervisor ID"
    );

    if(!supervisorId){
        return;
    }

    const reason =
    prompt(
        "Enter Delete Reason"
    );

    if(!reason){
        alert(
        "Delete Reason Required"
        );
        return;
    }

    await updateDoc(
        doc(
            db,
            "startup_verification",
            recordId
        ),
        {
            deleted:true,
            deletedBy:supervisorId,
            deleteReason:reason,
            deletedDate:
            new Date().toISOString()
        }
    );

    await addDoc(
        collection(db,"audit_logs"),
        {
            action:"DELETE_RECORD",
            recordId:recordId,
            supervisorId:supervisorId,
            reason:reason,
            timestamp:
            new Date().toISOString()
        }
    );

    alert(
    "Record deleted successfully"
    );

    loadRecords();

function formatDate(dateValue){

    if(!dateValue) return "";

    const d = new Date(dateValue);

    return d.toLocaleString(
        "en-PH",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );

}

}
async function exportDeletedRecords(){

    let csv = [];

    csv.push(
"Operator,Employee ID,Workstation,Process,Deleted By,Delete Reason,Deleted Date"
    );

    const snapshot =
    await getDocs(
        collection(
            db,
            "startup_verification"
        )
    );

    snapshot.forEach(doc => {

        const data = doc.data();

        if(data.deleted === true){

            csv.push(
    `"${data.operator || ""}","${data.employeeId || ""}","${data.workstation || ""}","${data.process || ""}","${data.deletedBy || ""}","${data.deleteReason || ""}","${formatDate(data.deletedDate)}"`
);

        }

    });

    const blob = new Blob(
    [csv.join("\n")],
    {
        type:"text/csv;charset=utf-8;"
    });

    const url =
    URL.createObjectURL(blob);

    const link =
    document.createElement("a");

    link.href = url;

    link.download =
    "FPCA_Deleted_Records.csv";

    link.click();

}
function formatDate(dateValue){

    if(!dateValue) return "";

    const d = new Date(dateValue);

    return d.toLocaleString(
        "en-PH",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );

}
async function exportAuditLogs(){

    let csv = [];

    csv.push(
        "Action,Username,Supervisor ID,Reason,Timestamp"
    );

    const snapshot =
    await getDocs(
        collection(
            db,
            "audit_logs"
        )
    );

    snapshot.forEach(doc => {

        const data = doc.data();

        csv.push(
    `"${data.action || ""}","${data.username || ""}","${data.supervisorId || ""}","${data.reason || ""}","${formatDate(data.timestamp)}"`
);

    });

    const blob = new Blob(
        [csv.join("\n")],
        {
            type:"text/csv;charset=utf-8;"
        }
    );

    const url =
    URL.createObjectURL(blob);

    const link =
    document.createElement("a");

    link.href = url;

    link.download =
    "FPCA_Audit_Logs.csv";

    document.body.appendChild(link);

link.click();

document.body.removeChild(link);

URL.revokeObjectURL(url);

}
</script>

</body>

</html>
